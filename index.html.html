<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>测测你的童年含金量 · 90后00后专属</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#fdf6e3;
    --bg-soft:#fbe9c9;
    --card:#fffbeb;
    --ink:#3f2a14;
    --ink-soft:#8a6a45;
    --primary:#c2410c;
    --primary-deep:#9a3412;
    --primary-soft:#fcd9b8;
    --accent:#e0a458;
    --paper:#fff8e7;
    --shadow:0 10px 28px rgba(154,52,18,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 10% -5%, #fcd9b8 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #fbe9c9 0%, transparent 50%),
      radial-gradient(circle at 50% 110%, #ffe9c2 0%, transparent 55%),
      var(--bg);
  }
  .app{
    max-width:480px;margin:0 auto;min-height:100vh;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    position:relative;
  }
  .serif{font-family:"Noto Serif SC",serif}
  .view{display:none;animation:fadeIn .35s ease}
  .view.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .footer-note{margin-top:28px;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.85;line-height:1.6}

  /* ===== Landing ===== */
  .hero{margin-top:24px;text-align:center}
  .hero .badge{
    display:inline-block;padding:6px 14px;border-radius:999px;
    background:var(--primary-soft);color:var(--primary-deep);
    font-size:12px;letter-spacing:2px;font-weight:500;
  }
  .hero h1{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:30px;line-height:1.35;margin:18px 0 10px;letter-spacing:1px;
  }
  .hero h1 .hl{
    background:linear-gradient(180deg,transparent 60%,#fcd9b8 60%);
    padding:0 2px;
  }
  .hero .sub{color:var(--ink-soft);font-size:14px;margin-bottom:24px}

  .hero-art{
    width:100%;aspect-ratio:1/0.85;border-radius:24px;
    background:
      radial-gradient(circle at 20% 25%, #fcd9b8 0%, transparent 45%),
      radial-gradient(circle at 80% 75%, #e0a458 0%, transparent 55%),
      linear-gradient(135deg,#fbe9c9,#fcd9b8);
    position:relative;overflow:hidden;box-shadow:var(--shadow);
    margin-bottom:24px;
  }
  /* 老式电视机 */
  .tv{
    position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
    width:150px;height:110px;background:#5b3a1f;border-radius:14px;
    box-shadow:inset 0 0 0 4px #3f2a14;
  }
  .tv .screen{
    position:absolute;left:12px;top:12px;width:90px;height:70px;
    background:repeating-linear-gradient(0deg,#fff8e7 0 3px,#fbe9c9 3px 6px);
    border-radius:8px;
  }
  .tv .knobs{
    position:absolute;right:10px;top:14px;display:flex;flex-direction:column;gap:6px;
  }
  .tv .knobs i{
    width:10px;height:10px;border-radius:50%;background:#fcd9b8;display:block;
  }
  .tv .antenna{
    position:absolute;left:50%;top:-18px;width:2px;height:22px;background:#3f2a1f;
    transform-origin:bottom center;
  }
  .tv .antenna.a1{transform:translateX(-50%) rotate(-25deg)}
  .tv .antenna.a2{transform:translateX(-50%) rotate(20deg)}
  /* 太阳光斑 */
  .sun{
    position:absolute;top:14px;right:20px;width:36px;height:36px;border-radius:50%;
    background:#e0a458;opacity:.7;
    box-shadow:0 0 24px 8px rgba(224,164,88,.4);
  }
  .cloud{
    position:absolute;background:#fff8e7;border-radius:999px;opacity:.8;
  }
  .cloud.c1{width:60px;height:14px;top:24px;left:24px}
  .cloud.c2{width:40px;height:10px;top:48px;left:50px}

  .features{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
  .feature{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:16px;padding:12px 16px;
    box-shadow:0 4px 14px rgba(154,52,18,.1);
    font-size:14px;
  }
  .feature .check{
    flex:none;width:22px;height:22px;border-radius:50%;
    background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
  }
  .feature .label{font-weight:700;color:var(--primary-deep)}
  .feature .desc{color:var(--ink-soft)}

  .cta{
    display:block;width:100%;padding:16px;
    background:linear-gradient(135deg,var(--primary),var(--primary-deep));
    color:#fff;border:none;border-radius:999px;
    font-size:16px;font-weight:700;letter-spacing:2px;
    box-shadow:0 10px 24px rgba(194,65,12,.35);
    cursor:pointer;transition:transform .15s ease;
    font-family:inherit;
  }
  .cta:active{transform:scale(.97)}

  /* ===== Quiz ===== */
  .quiz-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:8px 0 14px;font-size:12px;color:var(--ink-soft);
  }
  .progress{
    width:100%;height:6px;background:var(--primary-soft);border-radius:999px;
    overflow:hidden;margin-bottom:24px;
  }
  .progress > div{
    height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-deep));
    border-radius:999px;transition:width .3s ease;
  }
  .q-card{
    background:var(--card);border-radius:22px;padding:24px 20px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .q-card::before{
    content:"";position:absolute;left:20px;right:20px;top:14px;height:1px;
    background:repeating-linear-gradient(90deg,var(--primary-soft) 0 6px,transparent 6px 12px);
  }
  .q-num{
    font-size:12px;color:var(--primary-deep);font-weight:700;
    letter-spacing:2px;margin-bottom:10px;
  }
  .q-title{
    font-family:"Noto Serif SC",serif;font-weight:700;
    font-size:19px;line-height:1.5;margin-bottom:20px;
  }
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;background:var(--bg-soft);
    border:1.5px solid transparent;border-radius:14px;
    padding:14px 16px;font-size:14px;color:var(--ink);
    cursor:pointer;transition:all .15s ease;font-family:inherit;
    line-height:1.5;
  }
  .opt:hover{background:var(--primary-soft)}
  .opt.selected{
    background:var(--paper);border-color:var(--primary);color:var(--primary-deep);font-weight:500;
  }
  .opt .key{
    display:inline-block;width:22px;height:22px;border-radius:50%;
    background:var(--paper);color:var(--primary-deep);font-size:12px;font-weight:700;
    text-align:center;line-height:22px;margin-right:8px;flex:none;
  }
  .opt.selected .key{background:var(--primary);color:#fff}

  .quiz-nav{display:flex;gap:10px;margin-top:18px}
  .btn{
    flex:1;padding:12px;border-radius:999px;border:none;
    font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
  }
  .btn-ghost{background:transparent;color:var(--ink-soft)}
  .btn-primary{
    background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(194,65,12,.3);
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  /* ===== Result ===== */
  .result-wrap{text-align:center;padding-top:10px}
  .result-emoji{
    width:90px;height:90px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--primary),var(--primary-deep));
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(194,65,12,.35);
  }
  .result-emoji svg{width:46px;height:46px;fill:#fff}
  .result-tag{
    display:inline-block;padding:5px 14px;border-radius:999px;
    background:var(--primary-soft);color:var(--primary-deep);
    font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px;
  }
  .result-name{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:26px;line-height:1.3;margin-bottom:6px;
  }
  .result-sub{color:var(--primary-deep);font-size:14px;margin-bottom:20px;font-weight:500}
  .result-card{
    background:var(--card);border-radius:20px;padding:20px;text-align:left;
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  .result-card h4{
    font-size:12px;color:var(--primary-deep);letter-spacing:2px;
    margin-bottom:8px;font-weight:700;
  }
  .result-card p{font-size:14px;line-height:1.7;color:var(--ink)}
  .bars{margin-top:8px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
  .bar-row .name{width:96px;color:var(--ink-soft);flex:none;text-align:right}
  .bar-row .track{flex:1;height:6px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
  .bar-row .fill{height:100%;background:var(--primary);border-radius:999px}
  .bar-row .val{width:24px;text-align:right;color:var(--ink-soft)}

  .share-tip{
    background:var(--bg-soft);border-radius:14px;padding:12px 16px;
    font-size:12px;color:var(--ink-soft);margin-bottom:16px;line-height:1.6;
  }

  @media (min-width:480px){
    .app{padding:40px 32px}
    .hero h1{font-size:34px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 落地页 ===== -->
  <section class="view active" id="view-landing">

  </section>

  <!-- ===== 结果页 ===== -->
  <section class="view" id="view-result">
    <div class="result-wrap">
      <div class="result-emoji">
        <svg viewBox="0 0 24 24"><path d="M12 2L15 8.5L22 9.3L17 14L18.2 21L12 17.8L5.8 21L7 14L2 9.3L9 8.5Z"/></svg>
      </div>
      <span class="result-tag" id="r-tag">YOUR RESULT</span>

      <div class="result-sub" id="r-sub"></div>

      <div class="result-card">
        <h4>人 设 解 读</h4>
        <p id="r-persona"></p>
      </div>
      <div class="result-card">
        <h4>一 句 话</h4>
        <p id="r-one"></p>
      </div>
      <div class="result-card">
        <h4>童 年 含 金 量</h4>
        <p id="r-tip"></p>
      </div>

      <div class="result-card">
        <h4>你 的 童 年 分 布</h4>
        <div class="bars" id="r-bars"></div>
      </div>

      <div class="share-tip">
        转发给你当年一起逃课的那位 ｜ 评论区扣你的童年类型
      </div>

      <button class="cta" onclick="restart()">再测一次 →</button>

    <p class="footer-note">仅供娱乐 · 致我们再也回不去的暑假</p>

</div>

<script>

  a:{persona:"你的童年没有培训班，只有胡同口、电线杆和满膝盖的土。放学书包一扔就冲出大院，不到天黑妈不喊绝不回家。你会爬树、会拍画片、会用弹弓打瓶子，夏天的记忆是蝉鸣、冰棍纸和傍晚的胡同。",one:"你的童年含金量不在物质，在自由。那是现在的小孩用钱都买不回来的东西。",tip:"哪天路过老胡同，蹲下来摸摸那块被你磨亮的石头——它还记得你。"},

let cur = 0;
const answers = new Array(QUESTIONS.length).fill(null);

function show(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}
function startQuiz(){ cur=0; show("view-quiz"); renderQ(); }
function restart(){ cur=0; answers.fill(null); show("view-landing"); }

function renderQ(){
  const q = QUESTIONS[cur];
  document.getElementById("q-num").textContent = "QUESTION " + String(cur+1).padStart(2,"0");
  document.getElementById("q-progress-text").textContent = (cur+1) + " / " + QUESTIONS.length;
  document.getElementById("q-bar").style.width = ((cur+1)/QUESTIONS.length*100) + "%";
  document.getElementById("q-title").textContent = q.t;

  const wrap = document.getElementById("opts");
  wrap.innerHTML = "";
  q.o.forEach((opt,idx)=>{
    const b = document.createElement("button");
    b.className = "opt" + (answers[cur]===idx?" selected":"");
    b.innerHTML = '<span class="key">'+opt.k+'</span>'+opt.txt;
    b.onclick = ()=>{
      answers[cur]=idx;
      [...wrap.children].forEach(c=>c.classList.remove("selected"));
      b.classList.add("selected");
      document.getElementById("btn-next").disabled = false;
      setTimeout(()=>nextQ(),260);
    };
    wrap.appendChild(b);
  });

  document.getElementById("btn-prev").disabled = cur===0;
  const btnNext = document.getElementById("btn-next");
  btnNext.disabled = answers[cur]===null;
  btnNext.textContent = cur===QUESTIONS.length-1 ? "查看结果 →" : "下一题 →";
}
function prevQ(){ if(cur>0){cur--;renderQ();} }
function nextQ(){
  if(answers[cur]===null) return;
  if(cur<QUESTIONS.length-1){ cur++; renderQ(); }
  else{ showResult(); }
}

function showResult(){
  const scores = {a:0,b:0,c:0,d:0,e:0,f:0,g:0,h:0};
  answers.forEach((ans,i)=>{
    if(ans===null) return;
    const tag = QUESTIONS[i].o[ans].tag;
    scores[tag]++;
  });
  let topKey="a", topScore=-1;
  for(const k in scores){ if(scores[k]>topScore){topScore=scores[k];topKey=k;} }

  const meta = RESULT_META[topKey];
  const desc = RESULT_DESC[topKey];
  document.getElementById("r-tag").textContent = "YOUR RESULT · " + meta.name;
  document.getElementById("r-name").textContent = meta.name;
  document.getElementById("r-sub").textContent = meta.sub;
  document.getElementById("r-persona").textContent = desc.persona;
  document.getElementById("r-one").textContent = desc.one;
  document.getElementById("r-tip").textContent = desc.tip;

  const barWrap = document.getElementById("r-bars");
  barWrap.innerHTML = "";
  const sorted = Object.keys(scores).sort((x,y)=>scores[y]-scores[x]).slice(0,5);
  sorted.forEach(k=>{
    const row = document.createElement("div");
    row.className="bar-row";
    row.innerHTML = '<div class="name">'+RESULT_META[k].name+'</div>'+
      '<div class="track"><div class="fill" style="width:'+(scores[k]/QUESTIONS.length*100)+'%"></div></div>'+
      '<div class="val">'+scores[k]+'</div>';
    barWrap.appendChild(row);
  });

  show("view-result");
}
</script>
